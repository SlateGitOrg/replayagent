name: CI
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.28"
      - name: Install Python 3.12
        run: uv python install 3.12
      - name: Sync dependencies (locked)
        run: uv sync --locked
      - name: make check (format, lint, types, tests + coverage)
        run: make check
      - name: make demo (offline end-to-end)
        run: make demo
